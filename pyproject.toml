[project]
name = "qwen-subtitle"
version = "0.1.0"
description = "Local offline Windows subtitle generator (CLI core + thin GUI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "QwenSubtitle" }]
dependencies = [
  "qwen-asr>=0.0.6",
  "numpy>=1.26",
  "soundfile>=0.12",
  "torch",
  "librosa>=0.10.2",
  "numba>=0.60.0",
  "silero-vad>=5.1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
# Explicit model fetch (download-models.cmd / scripts/download_models.py) — not used by transcribe.
fetch = ["huggingface_hub>=0.26"]
dev = ["pytest>=8.0", "huggingface_hub>=0.26"]

[project.scripts]
qsub = "qsub_core.cli:main"
qsub-gui = "gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsub_core", "gui"]

[tool.uv]
package = true
override-dependencies = [
  "numba>=0.60.0",
  "llvmlite>=0.43.0",
  "librosa>=0.10.2",
  "torchaudio==2.6.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
